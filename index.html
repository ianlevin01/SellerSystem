<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon — usar el SVG del ícono (cuadrado), no el logo horizontal -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png"     href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon"          href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Title (50–60 chars) -->
    <title>Ventaz — Vendé online con tu propia tienda digital</title>

    <!-- Meta description (150–160 chars) -->
    <meta name="description" content="Ventaz te permite crear tu tienda online, gestionar productos, pedidos y cobros desde un panel centralizado. Empezá a vender hoy." />

    <!-- Canonical -->
    <link rel="canonical" href="https://ventaz.com.ar/" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (WhatsApp, LinkedIn, Facebook) -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://ventaz.com.ar/" />
    <meta property="og:site_name"   content="Ventaz" />
    <meta property="og:title"       content="Ventaz — Vendé online con tu propia tienda digital" />
    <meta property="og:description" content="Creá tu tienda, publicá productos y cobrá tus ganancias. Ventaz es la plataforma para vendedores independientes." />
    <meta property="og:image"       content="https://ventaz.com.ar/ventaz.png" />
    <meta property="og:locale"      content="es_AR" />

    <!-- Twitter Cards -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Ventaz — Vendé online con tu propia tienda digital" />
    <meta name="twitter:description" content="Creá tu tienda, publicá productos y cobrá tus ganancias." />
    <meta name="twitter:image"       content="https://ventaz.com.ar/ventaz.png" />

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Ventaz",
      "url": "https://ventaz.com.ar",
      "logo": "https://ventaz.com.ar/ventaz.png",
      "description": "Plataforma para vendedores independientes: tienda online, gestión de productos y cobros.",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "availableLanguage": "Spanish"
      }
    }
    </script>

    <!-- JSON-LD: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Ventaz",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "url": "https://ventaz.com.ar",
      "description": "Panel para vendedores: gestión de tienda, productos, pedidos y cobros.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "ARS"
      }
    }
    </script>

    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1712717746439174');
      fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=1712717746439174&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
